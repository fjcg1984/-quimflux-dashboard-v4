<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b1220"
  >

  <title>QUIMFLUX Dashboard V5</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

  <style>

    /* =====================================================
       PANTALLA DE ARRANQUE
    ===================================================== */

    #boot {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background: #0b1220;

      color: #f4f7fb;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

    }


    #boot.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    #bootBox {

      width: min(100%, 600px);

      padding: 24px;

      border: 1px solid #26354d;

      border-radius: 18px;

      background: #111b2d;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, .35);

    }


    #bootTitle {

      font-size: 28px;

      font-weight: 800;

      margin-bottom: 10px;

    }


    #bootStatus {

      color: #94a3b8;

      line-height: 1.5;

    }


    #bootError {

      display: none;

      margin-top: 16px;

      padding: 14px;

      border-radius: 12px;

      background: #450a0a;

      border: 1px solid #ef4444;

      color: #fecaca;

      white-space: pre-wrap;

      word-break: break-word;

      font-size: 13px;

    }

  </style>

</head>


<body>


  <!-- ===================================================
       PANTALLA DE CARGA
  ==================================================== -->

  <div id="boot">

    <div id="bootBox">

      <div id="bootTitle">
        QUIMFLUX V5
      </div>

      <div id="bootStatus">
        Cargando aplicación...
      </div>

      <div id="bootError"></div>

    </div>

  </div>


  <!-- ===================================================
       APLICACIÓN
  ==================================================== -->

  <div id="app"></div>


  <!-- ===================================================
       CONTROL DE ARRANQUE
  ==================================================== -->

  <script>

    (function () {

      const boot =
        document.getElementById('boot');

      const app =
        document.getElementById('app');

      const status =
        document.getElementById('bootStatus');

      const errorBox =
        document.getElementById('bootError');


      /* -------------------------------------------------
         OCULTAR PANTALLA DE CARGA
      ------------------------------------------------- */

      function hideBoot() {

        if (!boot) return;

        boot.classList.add('hidden');

        setTimeout(
          function () {

            if (boot) {
              boot.remove();
            }

          },
          300
        );

      }


      /* -------------------------------------------------
         DETECTAR CUANDO MAIN.JS RENDERIZA LA APP
      ------------------------------------------------- */

      function checkApp() {

        if (
          app &&
          app.children.length > 0
        ) {

          hideBoot();

        }

      }


      /*
       * Observamos #app.
       *
       * Cuando main.js ejecuta:
       *
       * app.innerHTML = ...
       *
       * automáticamente quitamos
       * la pantalla "Cargando aplicación..."
       */

      if (app) {

        const observer =
          new MutationObserver(
            function () {

              checkApp();

            }
          );

        observer.observe(
          app,
          {
            childList: true,
            subtree: true
          }
        );

        /*
         * Comprobación inicial
         */

        checkApp();

      }


      /* -------------------------------------------------
         ERRORES JAVASCRIPT
      ------------------------------------------------- */

      window.addEventListener(
        'error',
        function (event) {

          /*
           * Si la aplicación ya apareció,
           * no tapamos el login/dashboard
           * con la pantalla de error.
           */

          if (
            app &&
            app.children.length > 0
          ) {

            return;

          }


          if (status) {

            status.textContent =
              'ERROR AL INICIAR QUIMFLUX';

          }


          if (errorBox) {

            errorBox.style.display =
              'block';

            errorBox.textContent =
              'Error: ' +
              (
                event.message ||
                'Error desconocido'
              ) +

              '\n\nArchivo: ' +

              (
                event.filename ||
                'desconocido'
              ) +

              '\n\nLínea: ' +

              (
                event.lineno ||
                '?'
              ) +

              '\nColumna: ' +

              (
                event.colno ||
                '?'
              );

          }

        }
      );


      /* -------------------------------------------------
         ERRORES DE PROMESAS
      ------------------------------------------------- */

      window.addEventListener(
        'unhandledrejection',
        function (event) {

          /*
           * Si main.js ya pintó la aplicación,
           * no mostramos pantalla de error encima.
           */

          if (
            app &&
            app.children.length > 0
          ) {

            return;

          }


          if (status) {

            status.textContent =
              'ERROR AL INICIAR QUIMFLUX';

          }


          if (errorBox) {

            errorBox.style.display =
              'block';

            errorBox.textContent =
              'Error de promesa:\n\n' +
              String(
                event.reason ||
                'Error desconocido'
              );

          }

        }
      );

    })();

  </script>


  <!-- ===================================================
       MAIN.JS
  ==================================================== -->

  <script
    type="module"
    src="./main.js">
  </script>


</body>
</html>
